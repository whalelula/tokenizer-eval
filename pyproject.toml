[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizer-evaluation"
version = "0.1.0"
description = "Evaluation framework for pretrained audio tokenizers and representation models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mert = [
    "transformers>=4.40",
]
hubert = [
    "transformers>=4.40",
]
same = [
    "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3.git",
]
stable-audio-open = [
    "stable-audio-tools @ git+https://github.com/Stability-AI/stable-audio-tools.git",
]
music2latents = [
    "music2latent @ git+https://github.com/SonyCSLParis/music2latent.git",
]
speechtokenizer = [
    "huggingface_hub>=0.23",
]
xcodec = [
    "transformers>=4.56",
]
extractors = [
    "transformers>=4.56",
    "huggingface_hub>=0.23",
]
viz = [
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]
eval = [
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "transformers>=4.40",
]
dev = [
    "ruff>=0.5",
]

[project.scripts]
prepare-nsynth = "tokenizer_evaluation.cli.prepare_nsynth:main"
extract-tokenizer-embeddings = "tokenizer_evaluation.cli.extract_embeddings:main"
run-instrument-tsne = "tokenizer_evaluation.cli.run_instrument_tsne:main"
run-knn-purity = "tokenizer_evaluation.cli.run_knn_purity:main"
run-pairwise-structure = "tokenizer_evaluation.cli.run_pairwise_structure:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
